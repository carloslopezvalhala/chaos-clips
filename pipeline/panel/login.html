<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<link rel="manifest" href="/manifest.json">
<title>Chaos Clips · Entrar</title>
<style>
:root{--bg:#0c0c0e;--panel:#16161a;--panel2:#1e1e24;--line:#2a2a32;--text:#eeeef0;--muted:#9a9aa6;--yel:#ffd700;--pink:#ff406e}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:22px;margin:0 0 4px;font-weight:800}
h1 span{color:var(--yel)}
p{color:var(--muted);margin:0 0 20px;font-size:14px}
input{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px;font-size:16px}
button{width:100%;margin-top:12px;background:var(--yel);color:#111;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:700;cursor:pointer}
#err{color:var(--pink);font-size:14px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f">
  <h1>CHAOS <span>CLIPS</span></h1>
  <p>Introduce la contraseña del panel.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Contraseña" autofocus>
  <button type="submit">Entrar</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, err = document.getElementById('err');
  if(!pw){ err.textContent = 'Escribe la contraseña.'; return; }
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pw})});
  const j = await r.json().catch(() => ({ok:false, error:'Error de conexión'}));
  if(j.ok) location.href = '/'; else err.textContent = j.error;
};
document.getElementById('pw').oninput = () => document.getElementById('err').textContent = '';
</script>
</body>
</html>
